[project]
name = "mcp-pdf"
version = "0.1.0"
description = "MCP PDF document analyzer — HTTP transport"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "pymupdf",
    "pydantic-settings",
    "uvicorn[standard]",
    "sentence-transformers>=5.4.1",
    "faiss-cpu>=1.13.2",
]

[project.scripts]
mcp-server = "mcp_pdf.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_pdf"]
